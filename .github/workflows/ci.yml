name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The whole suite is offline: the LLM is pi-ai's faux provider, the host
      # is an in-memory adapter, and the terminal is a stub. No secrets needed.
      - run: npm test
      - run: npm run build
